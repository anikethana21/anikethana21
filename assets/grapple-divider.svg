<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 36" width="100%" height="36">
  <defs>
    <linearGradient id="g-line-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020817" stop-opacity="0"/>
      <stop offset="70%" stop-color="#1e3a5f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g-line-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="30%" stop-color="#1e3a5f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020817" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60666e"/>
      <stop offset="50%" stop-color="#d5dceb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="g-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Cable -->
  <line x1="20" y1="18" x2="430" y2="18" stroke="url(#g-line-left)" stroke-width="1.5"/>
  <circle cx="430" cy="18" r="2" fill="#38bdf8"/>

  <!-- Center Miniature Grapple Claw from user's SVG -->
  <g transform="translate(435, 7) scale(0.14)">
    <path d="M 10,60 L 35,60 L 45,80 L 35,100 L 10,100 Z" fill="#121315" stroke="#38bdf8" stroke-width="3"/>
    <rect x="35" y="68" width="20" height="24" fill="url(#g-metal)"/>
    <path d="M 55,79 L 280,79 L 280,81 L 55,81 Z" fill="url(#g-metal)"/>
    <!-- Upper Claw -->
    <path d="M 70,27 C 120,25 180,40 280,60 C 220,77 150,80 60,72 Z" fill="url(#g-metal)" stroke="#111" stroke-width="3"/>
    <!-- Lower Claw -->
    <path d="M 70,133 C 120,135 180,120 280,100 C 220,83 150,80 60,88 Z" fill="url(#g-metal)" stroke="#111" stroke-width="3"/>
    <circle cx="62" cy="68" r="5" fill="#38bdf8" filter="url(#g-glow)"/>
    <circle cx="62" cy="92" r="5" fill="#38bdf8" filter="url(#g-glow)"/>
  </g>

  <!-- Right Cable -->
  <circle cx="475" cy="18" r="2" fill="#38bdf8"/>
  <line x1="475" y1="18" x2="880" y2="18" stroke="url(#g-line-right)" stroke-width="1.5"/>
</svg>
