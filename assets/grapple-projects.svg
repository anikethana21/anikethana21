<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="100%" height="100%">
  <defs>
    <!-- Metallic Gradients with high contrast for dark background -->
    <linearGradient id="gp-gun-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a626e"/>
      <stop offset="40%" stop-color="#32363d"/>
      <stop offset="100%" stop-color="#16181b"/>
    </linearGradient>
    <linearGradient id="gp-metal-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a94a6"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#5a626e"/>
    </linearGradient>
    <linearGradient id="gp-darkBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#33373d"/>
      <stop offset="100%" stop-color="#0f1114"/>
    </linearGradient>

    <!-- Glowing Cable Line Gradient -->
    <linearGradient id="gp-cable" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="gp-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="gp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip path to reveal text progressively as hook pulls across from left to right -->
    <clipPath id="gp-pull-reveal">
      <rect x="0" y="0" width="80" height="80">
        <!-- Width animates from 80 to 920 as the grappling hook pulls from left to right -->
        <animate attributeName="width" 
          values="80; 80; 920; 920; 920; 80" 
          keyTimes="0; 0.08; 0.42; 0.88; 0.94; 1" 
          dur="5s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .gp-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .gp-title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; }
  </style>

  <!-- Background Track Bar -->
  <rect x="10" y="8" width="980" height="64" rx="8" fill="#030816" stroke="#1e3a5f" stroke-width="1.5" opacity="0.95" />

  <!-- Tactical Rail Track Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.7">
    <line x1="20" y1="20" x2="980" y2="20" stroke-dasharray="4,6" />
    <line x1="20" y1="60" x2="980" y2="60" stroke-dasharray="4,6" />
    <line x1="110" y1="12" x2="110" y2="68" />
    <line x1="910" y1="12" x2="910" y2="68" />
  </g>

  <!-- LEFT: GRAPPLE LAUNCHER GUN (from user's SVG) -->
  <g transform="translate(-32, 5) scale(0.24)">
    <g id="core-front-housing">
      <path d="M 390,52 L 565,52 L 565,110 L 595,110 L 595,160 L 580,160 L 580,250 L 525,255 L 520,200 L 400,200 L 390,170 Z" fill="url(#gp-gun-body)" stroke="#090a0b" stroke-width="3"/>
      <rect x="400" y="58" width="150" height="42" fill="#2d323b" stroke="#4b5563" stroke-width="2"/>
      <path d="M 525,120 L 580,120 L 580,190 L 525,190 Z" fill="#22252a" stroke="#4b5563" stroke-width="2"/>
      <path d="M 535,210 L 535,245 M 543,210 L 543,245 M 551,210 L 551,245 M 559,210 L 559,245 M 567,210 L 567,245" stroke="#38bdf8" stroke-width="3"/>
      <!-- Muzzle collar with cyan power emitter -->
      <rect x="580" y="125" width="18" height="24" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" filter="url(#gp-glow)"/>
    </g>
  </g>

  <!-- EXTENDING STEEL GRAPPLE CABLE (from launcher nozzle at X=110, Y=40 to Hook Claw) -->
  <line x1="110" y1="40" x2="115" y2="40" stroke="url(#gp-cable)" stroke-width="2.5" filter="url(#gp-glow)">
    <animate attributeName="x2" 
      values="115; 115; 915; 915; 915; 115" 
      keyTimes="0; 0.08; 0.42; 0.88; 0.94; 1" 
      dur="5s" repeatCount="indefinite" />
  </line>

  <!-- PULL-REVEALED TEXT: FEATURED PROJECTS -->
  <g clip-path="url(#gp-pull-reveal)">
    <!-- HUD Header Tag -->
    <text x="135" y="27" class="gp-mono" font-size="10" fill="#38bdf8" letter-spacing="3" font-weight="700">
      [ TACTICAL ARCHIVE // CLASSIFIED PROJECTS ]
    </text>

    <!-- Main Title -->
    <text x="135" y="54" class="gp-title" font-size="25" fill="url(#gp-text-grad)" letter-spacing="4">
      FEATURED PROJECTS
    </text>

    <!-- Decorative HUD Bracket Line under text -->
    <line x1="135" y1="62" x2="540" y2="62" stroke="#3b82f6" stroke-width="1.5" opacity="0.85" />
    <circle cx="543" cy="62" r="2.5" fill="#38bdf8" />
  </g>

  <!-- ANIMATED GRAPPLING HOOK CLAW (from user's SVG, horizontally pulled left to right) -->
  <g>
    <!-- Animate transform X across the canvas -->
    <animateTransform attributeName="transform" type="translate"
      values="110, 17; 110, 17; 910, 17; 910, 17; 910, 17; 110, 17"
      keyTimes="0; 0.08; 0.42; 0.88; 0.94; 1"
      dur="5s" repeatCount="indefinite" />

    <!-- Scaled Claw Component -->
    <g transform="scale(0.28)">
      <!-- Isolated Hook Mechanism from user's gemini-svg (1).svg -->
      <!-- Mounting Socket Collar -->
      <path d="M 10,60 L 35,60 L 45,80 L 35,100 L 10,100 Z" fill="url(#gp-darkBase)" stroke="#111" stroke-width="2"/>
      <rect x="35" y="68" width="20" height="24" fill="url(#gp-metal-light)" stroke="#222" stroke-width="1.5"/>

      <!-- Central Penetration Spike -->
      <path d="M 55,79 L 280,79 L 280,81 L 55,81 Z" fill="#ffffff"/>

      <!-- Upper Claw Jaw -->
      <g id="hook-upper-jaw">
        <path d="M 38,68 L 58,25 L 78,25 L 62,68 Z" fill="#32363d" stroke="#111" stroke-width="1.5"/>
        <path d="M 70,27 C 120,25 180,40 280,60 C 220,77 150,80 60,72 Z" fill="url(#gp-metal-light)" stroke="#1a1c1e" stroke-width="2"/>
        <path d="M 130,75 L 145,68 L 160,74 L 175,67 L 190,73 L 205,66 L 220,71 L 235,65" stroke="#1d1e21" stroke-width="2" fill="none"/>
        <circle cx="62" cy="68" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
      </g>

      <!-- Lower Claw Jaw -->
      <g id="hook-lower-jaw">
        <path d="M 38,92 L 58,135 L 78,135 L 62,92 Z" fill="#32363d" stroke="#111" stroke-width="1.5"/>
        <path d="M 70,133 C 120,135 180,120 280,100 C 220,83 150,80 60,88 Z" fill="url(#gp-metal-light)" stroke="#1a1c1e" stroke-width="2"/>
        <path d="M 130,85 L 145,92 L 160,86 L 175,93 L 190,87 L 205,94 L 220,89 L 235,95" stroke="#1d1e21" stroke-width="2" fill="none"/>
        <circle cx="62" cy="92" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
      </g>

      <!-- Impact Energy Sparks / Glow on hook tip -->
      <circle cx="280" cy="80" r="12" fill="#38bdf8" opacity="0.8" filter="url(#gp-glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="0.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Right Target Anchor Pad -->
  <g transform="translate(935, 20)" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.9">
    <rect x="0" y="0" width="40" height="40" rx="4" fill="#0b1329" stroke="#1e3a5f" />
    <path d="M 8,10 L 20,20 L 8,30" />
    <path d="M 20,10 L 32,20 L 20,30" />
  </g>
</svg>
