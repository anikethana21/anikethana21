<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4e54"/>
      <stop offset="40%" stop-color="#2a2c30"/>
      <stop offset="100%" stop-color="#121315"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#717882"/>
      <stop offset="50%" stop-color="#d5dcdeb"/>
      <stop offset="100%" stop-color="#484e56"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282a2e"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60666e"/>
      <stop offset="100%" stop-color="#32363b"/>
    </linearGradient>
  </defs>

  <g id="grapple-tool-full">
    <!-- Handle & Grip Section -->
    <g id="handle">
      <path d="M 60,180 C 40,200 25,240 25,320 C 25,355 45,370 75,370 C 120,370 145,330 165,270 C 175,240 165,200 145,180 Z" fill="url(#darkMetal)" stroke="#050505" stroke-width="3"/>
      <!-- Grip Textures -->
      <path d="M 40,270 L 145,250 M 38,285 L 148,265 M 36,300 L 150,280 M 35,315 L 148,295 M 35,330 L 140,310 M 38,345 L 125,330" stroke="#181a1c" stroke-width="4" stroke-linecap="round"/>
      <circle cx="130" cy="325" r="5" fill="#111" stroke="#444" stroke-width="1.5"/>
      <circle cx="75" cy="245" r="5" fill="#111" stroke="#444" stroke-width="1.5"/>
    </g>

    <!-- Main Drum / Cable Reel -->
    <g id="drum-assembly">
      <circle cx="160" cy="180" r="85" fill="url(#bodyGrad)" stroke="#0a0a0b" stroke-width="4"/>
      <circle cx="160" cy="180" r="68" fill="#17181b" stroke="#33373d" stroke-width="3"/>
      <circle cx="160" cy="180" r="48" fill="url(#darkMetal)" stroke="#0a0a0b" stroke-width="2"/>
      
      <!-- Reel Mechanism Plate -->
      <path d="M 160,112 A 68 68 0 0 1 228,180 L 195,180 A 35 35 0 0 0 160,145 Z" fill="#222529" stroke="#3a3e45" stroke-width="1.5"/>
      <circle cx="160" cy="180" r="10" fill="#090a0a" stroke="#60666e" stroke-width="2"/>
      
      <!-- Top Lever Bracket -->
      <path d="M 80,135 C 100,80 160,55 185,55 C 190,55 190,65 180,70 C 150,85 110,110 95,140 Z" fill="url(#accentGrad)" stroke="#111" stroke-width="2"/>
      <path d="M 152,60 L 168,180 L 188,180 L 172,60 Z" fill="url(#accentGrad)" stroke="#0d0e10" stroke-width="2"/>
      <circle cx="170" cy="180" r="6" fill="#50555c" stroke="#111" stroke-width="1.5"/>
    </g>

    <!-- Mid Receiver Body -->
    <g id="mid-receiver">
      <path d="M 180,95 L 390,95 L 390,120 L 360,120 L 350,185 L 280,210 L 230,210 L 180,180 Z" fill="url(#bodyGrad)" stroke="#0a0a0b" stroke-width="3"/>
      <!-- Top Rail Teeth -->
      <path d="M 230,95 L 230,88 M 242,95 L 242,88 M 254,95 L 254,88 M 266,95 L 266,88 M 278,95 L 278,88 M 290,95 L 290,88 M 302,95 L 302,88 M 314,95 L 314,88" stroke="#1a1b1d" stroke-width="3"/>
      <!-- Frame Bolts -->
      <circle cx="280" cy="115" r="3.5" fill="#111" stroke="#555" stroke-width="1"/>
      <circle cx="300" cy="115" r="3.5" fill="#111" stroke="#555" stroke-width="1"/>
      <path d="M 270,140 L 340,140 L 330,175 L 270,175 Z" fill="#191a1c" stroke="#2d3035" stroke-width="1.5"/>
    </g>

    <!-- Piston & Shaft Tube -->
    <g id="piston-shaft">
      <rect x="380" y="115" width="70" height="40" fill="url(#darkMetal)" stroke="#000" stroke-width="2"/>
      <!-- Threaded Cylinder -->
      <rect x="400" y="120" width="30" height="30" fill="url(#metalGrad)" stroke="#111" stroke-width="1"/>
      <line x1="406" y1="120" x2="406" y2="150" stroke="#333" stroke-width="2"/>
      <line x1="412" y1="120" x2="412" y2="150" stroke="#333" stroke-width="2"/>
      <line x1="418" y1="120" x2="418" y2="150" stroke="#333" stroke-width="2"/>
      <line x1="424" y1="120" x2="424" y2="150" stroke="#333" stroke-width="2"/>
    </g>

    <!-- Front Housing Block -->
    <g id="front-block">
      <path d="M 390,52 L 565,52 L 565,110 L 595,110 L 595,230 L 580,235 L 580,250 L 525,255 L 520,200 L 400,200 L 390,170 Z" fill="url(#bodyGrad)" stroke="#090a0b" stroke-width="3"/>
      <rect x="400" y="58" width="150" height="42" fill="#212326" stroke="#35383f" stroke-width="1.5"/>
      <path d="M 525,120 L 580,120 L 580,190 L 525,190 Z" fill="#17181a" stroke="#2c2f34" stroke-width="2"/>
      <!-- Vertical Ridge Texture -->
      <path d="M 535,210 L 535,245 M 543,210 L 543,245 M 551,210 L 551,245 M 559,210 L 559,245 M 567,210 L 567,245" stroke="#111" stroke-width="2.5"/>
    </g>

    <!-- Hook Mechanism Attachment -->
    <g id="hook-head">
      <!-- Base Collar -->
      <rect x="595" y="125" width="22" height="22" fill="url(#metalGrad)" stroke="#111" stroke-width="1.5"/>
      <path d="M 617,118 L 640,118 L 648,136 L 640,154 L 617,154 Z" fill="url(#accentGrad)" stroke="#0d0e0f" stroke-width="1.5"/>
      
      <!-- Central Dart / Spear Core -->
      <path d="M 648,134 L 810,134 L 810,138 L 648,138 Z" fill="url(#metalGrad)"/>

      <!-- Upper Articulated Jaw -->
      <g id="upper-claw">
        <path d="M 632,122 L 650,90 L 665,90 L 652,122 Z" fill="#3a3d42" stroke="#111" stroke-width="1"/>
        <path d="M 660,92 C 700,90 740,100 815,115 C 770,128 710,130 650,125 Z" fill="url(#metalGrad)" stroke="#1a1c1e" stroke-width="2"/>
        <!-- Serrated Teeth -->
        <path d="M 720,126 L 730,121 L 740,125 L 750,120 L 760,124 L 770,119 L 780,122" stroke="#222" stroke-width="1.5" fill="none"/>
        <circle cx="653" cy="122" r="3.5" fill="#111" stroke="#888" stroke-width="1"/>
      </g>

      <!-- Lower Articulated Jaw -->
      <g id="lower-claw">
        <path d="M 632,150 L 650,175 L 665,175 L 652,150 Z" fill="#3a3d42" stroke="#111" stroke-width="1"/>
        <path d="M 660,180 C 700,182 740,172 815,157 C 770,144 710,142 650,147 Z" fill="url(#metalGrad)" stroke="#1a1c1e" stroke-width="2"/>
        <!-- Serrated Teeth -->
        <path d="M 720,146 L 730,151 L 740,147 L 750,152 L 760,148 L 770,153 L 780,150" stroke="#222" stroke-width="1.5" fill="none"/>
        <circle cx="653" cy="150" r="3.5" fill="#111" stroke="#888" stroke-width="1"/>
      </g>
    </g>
  </g>
</svg>
