<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 36" width="100%" height="36">
  <defs>
    <filter id="p-glow-01" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "Courier New", monospace; }
  </style>
  <rect width="400" height="36" rx="5" fill="#000000" stroke="#052e16" stroke-width="1.2" />
  <rect x="1" y="1" width="398" height="34" rx="4" fill="none" stroke="#00ff41" stroke-width="1" stroke-opacity="0.3" />
  <!-- Corner Brackets -->
  <g stroke="#00ff41" stroke-width="1.4" fill="none">
    <path d="M 6,11 L 6,6 L 11,6" />
    <path d="M 394,11 L 394,6 L 389,6" />
    <path d="M 6,25 L 6,30 L 11,30" />
    <path d="M 394,25 L 394,30 L 389,30" />
  </g>
  <!-- Title: White crisp with phosphor green glow -->
  <text x="18" y="23" class="mono" font-size="13" font-weight="900" fill="#00ff41" letter-spacing="1.5" filter="url(#p-glow-01)">&gt; ONE SWAGGER</text>
  <text x="18" y="23" class="mono" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="1.5">&gt; ONE SWAGGER</text>
  <!-- Cyber dashed line -->
  <line x1="160" y1="18" x2="365" y2="18" stroke="#052e16" stroke-width="1" stroke-dasharray="4 3" />
  <!-- Right pulsing green node -->
  <circle cx="380" cy="18" r="3.5" fill="#00ff41" filter="url(#p-glow-01)">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
