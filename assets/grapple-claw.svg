<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" width="100%" height="100%">
  <defs>
    <linearGradient id="hookMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60666e"/>
      <stop offset="40%" stop-color="#d5dceb"/>
      <stop offset="100%" stop-color="#3a3d42"/>
    </linearGradient>
    <linearGradient id="darkBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2c30"/>
      <stop offset="100%" stop-color="#121315"/>
    </linearGradient>
  </defs>

  <g id="isolated-hook-mechanism">
    <!-- Mounting Socket Collar -->
    <path d="M 10,60 L 35,60 L 45,80 L 35,100 L 10,100 Z" fill="url(#darkBase)" stroke="#000" stroke-width="2"/>
    <rect x="35" y="68" width="20" height="24" fill="url(#hookMetal)" stroke="#111" stroke-width="1.5"/>

    <!-- Central Penetration Spike -->
    <path d="M 55,79 L 280,79 L 280,81 L 55,81 Z" fill="url(#hookMetal)"/>

    <!-- Upper Claw Jaw -->
    <g id="hook-upper-jaw">
      <path d="M 38,68 L 58,25 L 78,25 L 62,68 Z" fill="#2d3035" stroke="#000" stroke-width="1.5"/>
      <path d="M 70,27 C 120,25 180,40 280,60 C 220,77 150,80 60,72 Z" fill="url(#hookMetal)" stroke="#111" stroke-width="2"/>
      <!-- Inner Serrations -->
      <path d="M 130,75 L 145,68 L 160,74 L 175,67 L 190,73 L 205,66 L 220,71 L 235,65" stroke="#1d1e21" stroke-width="2" fill="none"/>
      <!-- Pivot Pin -->
      <circle cx="62" cy="68" r="4.5" fill="#111" stroke="#999" stroke-width="1.5"/>
    </g>

    <!-- Lower Claw Jaw -->
    <g id="hook-lower-jaw">
      <path d="M 38,92 L 58,135 L 78,135 L 62,92 Z" fill="#2d3035" stroke="#000" stroke-width="1.5"/>
      <path d="M 70,133 C 120,135 180,120 280,100 C 220,83 150,80 60,88 Z" fill="url(#hookMetal)" stroke="#111" stroke-width="2"/>
      <!-- Inner Serrations -->
      <path d="M 130,85 L 145,92 L 160,86 L 175,93 L 190,87 L 205,94 L 220,89 L 235,95" stroke="#1d1e21" stroke-width="2" fill="none"/>
      <!-- Pivot Pin -->
      <circle cx="62" cy="92" r="4.5" fill="#111" stroke="#999" stroke-width="1.5"/>
    </g>
  </g>
</svg>
