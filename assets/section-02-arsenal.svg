<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 44" width="100%" height="44">
  <defs>
    <filter id="glow-02" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .mono {
      font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Monaco, Consolas, "Courier New", monospace;
    }
  </style>
  <rect width="900" height="44" rx="6" fill="#000000" stroke="#052e16" stroke-width="1.2" />
  <rect x="1" y="1" width="898" height="42" rx="5" fill="none" stroke="#00ff41" stroke-width="1" stroke-opacity="0.25" />
  <!-- Corner Brackets -->
  <g stroke="#00ff41" stroke-width="1.6" fill="none">
    <path d="M 8,14 L 8,8 L 14,8" />
    <path d="M 892,14 L 892,8 L 886,8" />
    <path d="M 8,30 L 8,36 L 14,36" />
    <path d="M 892,30 L 892,36 L 886,36" />
  </g>
  <!-- Title: Pure Phosphor Matrix Green -->
  <text x="24" y="28" class="mono" font-size="15" font-weight="900" fill="#00ff41" letter-spacing="2" filter="url(#glow-02)">&gt; 02 // TECH_ARSENAL</text>
  <text x="24" y="28" class="mono" font-size="15" font-weight="900" fill="#00ff41" letter-spacing="2">&gt; 02 // TECH_ARSENAL</text>
  <!-- Cyber dashed line -->
  <line x1="255" y1="22" x2="855" y2="22" stroke="#052e16" stroke-width="1" stroke-dasharray="6 4" />
  <!-- Right pulsing green node -->
  <circle cx="872" cy="22" r="4" fill="#00ff41" filter="url(#glow-02)">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
