<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
  <defs>
    <!-- Deep pitch black background with very subtle warm dark-amber vignette behind emblem -->
    <radialGradient id="bg-aura" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181204" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#080601" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <!-- Deep stealth black bat armor -->
    <linearGradient id="bat-armor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="50%" stop-color="#040404"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Thin Refined Golden Rim Gradient -->
    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Thin Golden Aura Filter for Bat Logo -->
    <filter id="gold-aura" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Golden Aura Filter for Background Rim -->
    <filter id="bg-gold-glow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Name Shimmer: Crisp White with subtle golden sheen -->
    <linearGradient id="name-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <style>
    .heading { 
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      font-weight: 900; 
    }
    .sub { 
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      font-weight: 600;
    }
  </style>

  <!-- Pitch Black Background with Subtle Golden Ambient Base -->
  <rect width="1000" height="200" fill="url(#bg-aura)" rx="8" />

  <!-- Thin Golden Aura Outer Frame around the background -->
  <rect x="2" y="2" width="996" height="196" rx="7" fill="none" stroke="url(#gold-rim)" stroke-width="1.2" opacity="0.45" filter="url(#bg-gold-glow)">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="5s" repeatCount="indefinite" />
  </rect>

  <!-- BEN AFFLECK BAT LOGO WITH THIN GOLDEN AURA -->
  <g transform="translate(20, -50) scale(0.96, 0.44)">
    <!-- Thin Golden Aura Glow Layer behind Bat Logo -->
    <path d="
      M 500,175
      L 572,150
      L 582,178
      C 650,185 690,160 736,110
      C 860,220 950,360 975,520
      C 910,465 835,455 802,482
      L 790,510
      Q 740,455 685,450
      L 500,595
      L 315,450
      Q 260,455 210,510
      L 198,482
      C 165,455 90,465 25,520
      C 50,360 140,220 264,110
      C 310,160 350,185 418,178
      L 428,150
      Z
    " fill="none" stroke="#fbbf24" stroke-width="3.5" opacity="0.6" filter="url(#gold-aura)">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite" />
    </path>

    <!-- Main Solid Stealth Black Bat Emblem with Thin Golden Rim -->
    <path d="
      M 500,175
      L 572,150
      L 582,178
      C 650,185 690,160 736,110
      C 860,220 950,360 975,520
      C 910,465 835,455 802,482
      L 790,510
      Q 740,455 685,450
      L 500,595
      L 315,450
      Q 260,455 210,510
      L 198,482
      C 165,455 90,465 25,520
      C 50,360 140,220 264,110
      C 310,160 350,185 418,178
      L 428,150
      Z
    " fill="url(#bat-armor)" stroke="url(#gold-rim)" stroke-width="1.8" />
  </g>

  <!-- NAME & CLEAN SUBTITLE CENTERED INSIDE BAT LOGO -->
  <g text-anchor="middle">
    <!-- Main Name: ANIKETHANA - Big, bold, clean white with golden-tinted crisp presence -->
    <text x="500" y="105" class="heading" font-size="52" fill="url(#name-shimmer)" letter-spacing="12">
      ANIKETHANA
    </text>

    <!-- Minimal Subtle Golden Divider Line -->
    <line x1="380" y1="122" x2="620" y2="122" stroke="url(#gold-rim)" stroke-width="1" opacity="0.6" />

    <!-- Clean Subtitle -->
    <text x="500" y="142" class="sub" font-size="13" fill="#cbd5e1" letter-spacing="4">
      SOFTWARE ENGINEER  &#8226;  GENAI ARCHITECT
    </text>

    <!-- Minimal Affiliation Line -->
    <text x="500" y="165" class="sub" font-size="10.5" fill="#eab308" letter-spacing="2.5" opacity="0.85">
      SDE INTERN @ MY STARTUP WAVE
    </text>
  </g>
</svg>
