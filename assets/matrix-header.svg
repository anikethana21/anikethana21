<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%">
  <defs>
    <!-- Matrix Green Glow -->
    <filter id="matrix-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger Neon Glow for Name -->
    <filter id="name-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Fading stream gradient -->
    <linearGradient id="stream-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="60%" stop-color="#00aa28" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="1"/>
    </linearGradient>

    <!-- Cyber HUD Center Backdrop -->
    <radialGradient id="center-vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.92"/>
      <stop offset="60%" stop-color="#020803" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .matrix-mono {
      font-family: "Courier New", Courier, monospace, ui-monospace;
      font-weight: 700;
      user-select: none;
    }
    .title-font {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 900;
    }
    .cursor-blink {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Pitch Black Terminal Backdrop -->
  <rect width="900" height="180" fill="#030704" rx="8" />

  <!-- MATRIX DIGITAL RAIN FALLING STREAMS (Background Layer) -->
  <g class="matrix-mono" font-size="11" opacity="0.35">
    <!-- Stream 1 -->
    <text x="35" y="0" fill="#00ff41">
      <animate attributeName="y" values="-60;220" dur="2.4s" repeatCount="indefinite" />
      0 1 0 1 A 7 X 9 1 0 1
    </text>
    <!-- Stream 2 -->
    <text x="75" y="0" fill="#00cc33">
      <animate attributeName="y" values="-80;220" dur="3.1s" begin="0.4s" repeatCount="indefinite" />
      1 1 0 Z 9 4 M Q 0 1
    </text>
    <!-- Stream 3 -->
    <text x="120" y="0" fill="#00ff66">
      <animate attributeName="y" values="-100;220" dur="2.1s" begin="1.2s" repeatCount="indefinite" />
      M A T R I X 0 1 0 1 1
    </text>
    <!-- Stream 4 -->
    <text x="170" y="0" fill="#009922">
      <animate attributeName="y" values="-70;220" dur="3.5s" begin="0.7s" repeatCount="indefinite" />
      0 1 1 0 1 0 0 1 F E
    </text>
    <!-- Stream 5 -->
    <text x="220" y="0" fill="#00ff41">
      <animate attributeName="y" values="-90;220" dur="2.6s" begin="0.2s" repeatCount="indefinite" />
      G E N A I 0 1 0 1 9
    </text>
    <!-- Stream 6 -->
    <text x="680" y="0" fill="#00ff41">
      <animate attributeName="y" values="-80;220" dur="2.8s" begin="0.5s" repeatCount="indefinite" />
      N E X T J S 1 0 1 0
    </text>
    <!-- Stream 7 -->
    <text x="735" y="0" fill="#00cc33">
      <animate attributeName="y" values="-100;220" dur="2.2s" begin="1.5s" repeatCount="indefinite" />
      0 1 0 1 0 1 0 1 8 9
    </text>
    <!-- Stream 8 -->
    <text x="790" y="0" fill="#00ff66">
      <animate attributeName="y" values="-60;220" dur="3.3s" begin="0.3s" repeatCount="indefinite" />
      R E A C T 1 9 0 1 0
    </text>
    <!-- Stream 9 -->
    <text x="840" y="0" fill="#009922">
      <animate attributeName="y" values="-90;220" dur="2.7s" begin="0.9s" repeatCount="indefinite" />
      0 1 1 0 1 0 1 0 1 1
    </text>
    <!-- Stream 10 -->
    <text x="875" y="0" fill="#00ff41">
      <animate attributeName="y" values="-70;220" dur="2.9s" begin="1.1s" repeatCount="indefinite" />
      1 0 0 1 0 1 1 0 0 1
    </text>
  </g>

  <!-- Center Dark Vignette for Text Legibility -->
  <ellipse cx="450" cy="90" rx="420" ry="85" fill="url(#center-vignette)" />

  <!-- Subtle Matrix Cyber Border Line -->
  <rect x="2" y="2" width="896" height="176" rx="7" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.35">
    <animate attributeName="stroke-opacity" values="0.25;0.6;0.25" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- Corner Brackets -->
  <g stroke="#00ff41" stroke-width="1.8" fill="none" opacity="0.8">
    <path d="M 12,24 L 12,12 L 24,12" />
    <path d="M 888,24 L 888,12 L 876,12" />
    <path d="M 12,156 L 12,168 L 24,168" />
    <path d="M 888,156 L 888,168 L 876,168" />
  </g>

  <!-- Top Terminal Header Line -->
  <g class="matrix-mono" font-size="9" fill="#00ff41" opacity="0.75">
    <text x="28" y="22">&gt; MATRIX.SYS // OPERATIVE_CONNECTED [BENGALURU_NODE]</text>
    <text x="872" y="22" text-anchor="end">STATUS: UNPLUGGED // 2026</text>
  </g>

  <!-- MAIN NAME: ANIKETHANA (Phosphor Neon Green Glow) -->
  <g text-anchor="middle">
    <!-- Glowing Underlayer -->
    <text x="450" y="98" class="title-font" font-size="48" fill="#00ff41" letter-spacing="10" filter="url(#name-glow)" opacity="0.75">
      ANIKETHANA
    </text>
    <!-- Crisp Foreground Text -->
    <text x="450" y="98" class="title-font" font-size="48" fill="#ffffff" letter-spacing="10">
      ANIKETHANA
    </text>

    <!-- Matrix Green Terminal Divider -->
    <line x1="280" y1="116" x2="620" y2="116" stroke="#00ff41" stroke-width="1.5" opacity="0.8" filter="url(#matrix-glow)">
      <animate attributeName="x1" values="320;250;320" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="580;650;580" dur="4s" repeatCount="indefinite" />
    </line>

    <!-- Subtitle: Cyber Terminal Style -->
    <text x="450" y="138" class="matrix-mono" font-size="12" fill="#00ff41" letter-spacing="3" filter="url(#matrix-glow)">
      FULL-STACK ENGINEER  &#8226;  GENAI ARCHITECT
    </text>

    <!-- Affiliation with Typing Terminal Cursor -->
    <text x="450" y="158" class="matrix-mono" font-size="10.5" fill="#86efac" letter-spacing="2">
      SDE INTERN @ MY STARTUP WAVE  //  CREATOR OF ONE SWAGGER<tspan fill="#00ff41" class="cursor-blink">_</tspan>
    </text>
  </g>
</svg>
