<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
  <defs>
    <!-- Deep pitch black bat armor -->
    <linearGradient id="bat-armor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="50%" stop-color="#030303"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Refined Thin Golden Rim Gradient - ONLY FOR THE BAT LOGO -->
    <linearGradient id="bat-gold-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Thin Golden Aura Filter - ONLY FOR THE BAT LOGO -->
    <filter id="bat-gold-aura" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Crisp Platinum White Text Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <style>
    .heading { 
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      font-weight: 900; 
    }
    .sub { 
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      font-weight: 600;
    }
  </style>

  <!-- Pure Pitch Black Background -->
  <rect width="1000" height="200" fill="#000000" rx="8" />

  <!-- Subtle Stealth Dark Slate Border (NO GOLD ON BG) -->
  <rect x="2" y="2" width="996" height="196" rx="7" fill="none" stroke="#161b22" stroke-width="1.2" />

  <!-- BEN AFFLECK BAT LOGO - WITH THIN GOLDEN AURA -->
  <g transform="translate(20, -50) scale(0.96, 0.44)">
    <!-- Thin Golden Aura Glow Layer directly behind Bat Logo -->
    <path d="
      M 500,175
      L 572,150
      L 582,178
      C 650,185 690,160 736,110
      C 860,220 950,360 975,520
      C 910,465 835,455 802,482
      L 790,510
      Q 740,455 685,450
      L 500,595
      L 315,450
      Q 260,455 210,510
      L 198,482
      C 165,455 90,465 25,520
      C 50,360 140,220 264,110
      C 310,160 350,185 418,178
      L 428,150
      Z
    " fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.65" filter="url(#bat-gold-aura)">
      <!-- Subtle slow breathing pulse on the golden aura -->
      <animate attributeName="opacity" values="0.45;0.85;0.45" dur="4s" repeatCount="indefinite" />
    </path>

    <!-- Main Solid Stealth Black Bat Emblem with Thin Golden Rim -->
    <path d="
      M 500,175
      L 572,150
      L 582,178
      C 650,185 690,160 736,110
      C 860,220 950,360 975,520
      C 910,465 835,455 802,482
      L 790,510
      Q 740,455 685,450
      L 500,595
      L 315,450
      Q 260,455 210,510
      L 198,482
      C 165,455 90,465 25,520
      C 50,360 140,220 264,110
      C 310,160 350,185 418,178
      L 428,150
      Z
    " fill="url(#bat-armor)" stroke="url(#bat-gold-rim)" stroke-width="1.8" />
  </g>

  <!-- NAME & CLEAN SUBTITLE CENTERED INSIDE BAT LOGO -->
  <g text-anchor="middle">
    <!-- Main Name: ANIKETHANA - Crisp, commanding, pristine white -->
    <text x="500" y="105" class="heading" font-size="52" fill="url(#name-grad)" letter-spacing="12">
      ANIKETHANA
    </text>

    <!-- Subtle Minimal Divider Line -->
    <line x1="380" y1="122" x2="620" y2="122" stroke="#262626" stroke-width="1" />

    <!-- Clean Subtitle -->
    <text x="500" y="142" class="sub" font-size="13" fill="#94a3b8" letter-spacing="4">
      SOFTWARE ENGINEER  &#8226;  GENAI ARCHITECT
    </text>

    <!-- Minimal Affiliation Line -->
    <text x="500" y="165" class="sub" font-size="10.5" fill="#64748b" letter-spacing="2.5">
      SDE INTERN @ MY STARTUP WAVE
    </text>
  </g>
</svg>
